<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/main.css">
  <title>NodeChat</title>
</head>

<body>
  
  <div class="app hidden" id="appContainer">
    
    <aside class="sidebar" id="usersContainer">
      <div class="sidebar-scroll-section">
        <h3>Salas</h3>
        <ul class="sidebar-list" id="roomsList"></ul>
      </div>
      <div class="sidebar-scroll-section">
        <h3>Usuarios online</h3>
        <ul class="sidebar-list" id="usersList"></ul>
      </div>
    </aside>
    
    <main class="chat-container">
      <button id="btnToggleSidebar" class="menu-btn">☰</button>
      <div id="chat-head">
        <h1 id="title">💬 NodeChat</h1>
        <div id="buttonsHeader">
          <button id="btnExit" class="button">SALIR</button>
        </div>
      </div>
      <h2 id="title-room">Room</h2>

      <div id="chat"></div>

      <div id="input-area" class="input-area">
        <input type="text" id="messageInput" class="input" placeholder="Escribí un mensaje..." />
        <button id="btnMessage" class="button">Enviar</button>
      </div>

    </main>

  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="./main.js"></script>

</body>
</html>
