<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeChat - Crear cuenta</title>
  <link rel="stylesheet" href="../style/main.css">
</head>
<body>
  <header class="login-brand">
    <h1 id="login-title">💬 NodeChat</h1>
  </header>

  <main class="main-login">

    <form class="login-card" id="register-form" method="post" novalidate>
      <h2 class="login-heading">CREAR CUENTA</h2>

      <div class="field">
        <label class="field-label" for="nick">Nick (nombre visible en el chat)</label>
        <input class="field-input" id="nick" name="nick" type="text"
               placeholder="Tu nick" autocomplete="nickname" minlength="3" maxlength="20" required>
      </div>

      <div class="field">
        <label class="field-label" for="email">Correo electrónico</label>
        <input class="field-input" id="email" name="email" type="email"
               placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="password">Contraseña</label>
        <input class="field-input" id="password" name="password" type="password"
               placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required>
      </div>

      <p class="login-error" id="register-error" role="alert" aria-live="polite"></p>

      <button class="login-button" type="submit">Registrarme</button>

      <p class="login-hint">Te enviaremos un correo para confirmar tu cuenta.</p>

      <p class="login-text">
        ¿Ya tenés cuenta? <a class="login-link" href="login.html">Iniciá sesión</a>
      </p>
    </form>
  </main>

  <script type="module" src="register.js"></script>
</body>
</html>
